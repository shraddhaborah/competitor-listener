[project]
name = "competitor-listener"
version = "0.1.0"
description = "Watch competitor web pages and get LLM-triaged alerts when something meaningful changes."
requires-python = ">=3.10"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
